<title>Sports Rental · Informe interactivo</title>

<style>
/* ---------------------------------------------------------------------------
   TOKENS. Fuente unica de estilo del informe: `build_report.py` no minifica ni
   transforma el CSS, lo copia byte a byte al fichero final.

   Regla de forma, tres pasos y ninguno mas:
     --r-2   contenedores (tarjeta, barra de filtros, menu lateral, popover)
     --r-1   controles y pastillas dentro de un contenedor
     --r-pill  solo la etiqueta `tag`
   --------------------------------------------------------------------------- */
:root {
  color-scheme: light;

  /* Color. Paleta categorica de referencia con el azul corporativo #0082C3 en
     el primer slot; validada en claro y oscuro (banda de luminosidad, suelo de
     croma, separacion CVD, suelo de vision normal y contraste). */
  --plane:        #f9f9f7;
  --surface:      #fcfcfb;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --muted:        #898781;
  --grid:         #e1e0d9;
  --axis:         #c3c2b7;
  --hairline:     rgba(11,11,11,0.10);
  --neutral-mark: #b9b8b1;
  --good:         #006300;
  --bad:          #d03b3b;
  --warn:         #ec835a;
  --div-mid:      #f0efec;
  --s1: #0082C3; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  /* Nota: --s6 es el unico slot que no se re-derivo para oscuro, y en claro
     queda cerca de --good. Corregirlo exige volver a pasar la validacion
     CVD/contraste de la paleta, asi que se documenta en vez de sustituirlo a
     ojo por un valor sin validar. */

  /* Espaciado. Escala de 4 px: ninguna medida se escribe fuera de aqui. */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  /* Tipografia. Sin @font-face: el informe se abre con doble clic y sin red.
     La mono se reserva a lo que es literalmente codigo (nombres de fichero en
     el pie). Las cifras van en la sans con `font-variant-numeric: tabular-nums`:
     eso ya evita que bailen al filtrar, sin cambiar de voz ni depender de que
     mono traiga cada sistema operativo. */
  --f-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:  ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;

  --t-display: 28px;   /* cifra suelta grande */
  --t-figure:  22px;   /* valor de KPI, chip */
  --t-lead:    17px;   /* h1 */
  --t-title:   14px;   /* titulo de panel, unidad de la cifra */
  --t-body:    13px;   /* cuerpo, celda de tabla, control */
  --t-meta:    12px;   /* subtitulo, nota, pie */
  --t-micro:   11px;   /* eje, cabecera de tabla, label de KPI */
  --t-nano:    10px;   /* etiqueta dentro de marca; espejo en 04_charts.js */

  --w-reg: 400; --w-med: 500; --w-bold: 600;

  --r-1:    6px;
  --r-2:    10px;
  --r-pill: 999px;

  /* Elevacion. Dos pasos: lo que reposa y lo que flota. */
  --shadow:     0 1px 2px rgba(11,11,11,.05);
  --shadow-pop: 0 8px 24px rgba(11,11,11,.16);

  /* Foco: una sola receta para todo control. */
  --focus: 2px solid var(--s1);

  /* Riel de navegacion. Su paleta NO sigue al tema, y es deliberado: el riel no
     es documento, es el mueble donde esta colgado el documento. Manteniendolo
     oscuro en los dos temas, el borde entre "donde estoy" y "que estoy leyendo"
     no se difumina nunca, y el informe conserva el mismo perfil reconocible con
     luz y sin ella. Los tres tonos de texto estan por encima de 5:1 sobre el
     fondo del riel. */
  --rail:       248px;
  --rail-bg:    #141413;
  --rail-ink:   #ffffff;
  --rail-item:  #c9c7bf;
  --rail-label: #8b8981;
  --rail-line:  rgba(255,255,255,.09);
  --rail-on:    rgba(255,255,255,.07);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --hairline: rgba(255,255,255,0.10); --neutral-mark: #55544f;
    --good: #0ca30c; --bad: #e66767; --warn: #ec835a; --div-mid: #383835;
    --s1: #1f9fdb; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: none;
    --shadow-pop: 0 8px 24px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --hairline: rgba(255,255,255,0.10); --neutral-mark: #55544f;
  --good: #0ca30c; --bad: #e66767; --warn: #ec835a; --div-mid: #383835;
  --s1: #1f9fdb; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: none;
  --shadow-pop: 0 8px 24px rgba(0,0,0,.55);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: var(--w-reg) var(--t-body)/1.5 var(--f-sans);
  -webkit-font-smoothing: antialiased;
}
/* El contenido arranca donde acaba el riel. No se centra en el hueco restante:
   con una navegacion anclada a la izquierda, centrar el texto lo despega de su
   propio indice y en pantallas anchas deja el ojo saltando de un extremo a otro. */
.app {
  max-width: 1560px; margin-left: var(--rail);
  padding: 0 var(--sp-5) var(--sp-7);
}

/* Foco visible en todo lo enfocable, en los dos temas. */
:where(button, select, input, a, summary, [role="tab"]):focus-visible {
  outline: var(--focus); outline-offset: 2px;
}

/* --- riel de navegacion ---
   Fijo al borde de la ventana y de alto completo. No es una tarjeta: no lleva
   radio ni sombra ni margen, porque no flota sobre el plano, ES el borde de la
   pantalla. Por eso tambien es hermano de `.app` y no hijo: dentro de un
   contenedor centrado con ancho maximo no podria llegar al borde. */
.rail {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--rail); z-index: 60;
  display: flex; flex-direction: column; overflow-y: auto;
  background: var(--rail-bg); color: var(--rail-item);
  border-right: 1px solid var(--rail-line);
}
.rail .brand { padding: var(--sp-5) var(--sp-5) var(--sp-4); border-bottom: 1px solid var(--rail-line); }
.rail .bname {
  margin: 0; font-size: 15px; font-weight: var(--w-bold);
  letter-spacing: -.01em; color: var(--rail-ink);
}
/* La mono se reserva a lo que es metadato, no prosa: el subtitulo del rotulo,
   los nombres de bloque y el pie del riel. Esa voz distinta es lo que separa el
   aparato de navegacion del contenido sin tener que encerrarlo en una caja. */
.rail .bsub {
  margin-top: 4px; font-family: var(--f-num); font-size: var(--t-nano);
  text-transform: uppercase; letter-spacing: .14em; color: var(--rail-label);
}

.pages { display: flex; flex-direction: column; padding: var(--sp-3) 0 var(--sp-5); }
.pages .glabel {
  font-family: var(--f-num); font-size: var(--t-nano);
  text-transform: uppercase; letter-spacing: .14em; color: var(--rail-label);
  padding: var(--sp-4) var(--sp-5) var(--sp-2);
}
.pages .glabel:first-child { padding-top: var(--sp-1); }
/* La pagina activa es una banda de lado a lado del riel con una marca de acento
   pegada al canto izquierdo. Sin esquinas redondeadas: una pastilla flotando
   dentro de una barra fija se lee como un boton suelto, y esto no es un boton,
   es el sitio donde estas. */
.pages button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 0; border-radius: 0; background: none; color: var(--rail-item);
  font: inherit; font-size: var(--t-body); padding: 8px var(--sp-5);
  cursor: pointer; transition: background-color .12s, color .12s;
}
.pages button .pico { flex: none; color: var(--rail-label); }
.pages button:hover { color: var(--rail-ink); background: rgba(255,255,255,.045); }
.pages button:hover .pico { color: var(--rail-item); }
.pages button[aria-selected="true"] {
  background: var(--rail-on); color: var(--rail-ink); font-weight: var(--w-med);
  box-shadow: inset 2px 0 0 var(--s1);
}
.pages button[aria-selected="true"] .pico { color: var(--s1); }
.rail :focus-visible { outline-offset: -2px; }

/* Pie del riel: de que dato va esto. La cadena de capas no es decoracion, son
   los nombres reales de los esquemas del proyecto dbt. */
.railfoot {
  margin-top: auto; padding: var(--sp-4) var(--sp-5) var(--sp-5);
  border-top: 1px solid var(--rail-line);
  font-size: var(--t-nano); line-height: 1.8; color: var(--rail-label);
}
.railfoot b { color: var(--rail-item); font-weight: var(--w-med); font-variant-numeric: tabular-nums; }
.railfoot .chain {
  margin-top: var(--sp-3); padding-top: var(--sp-3);
  border-top: 1px solid var(--rail-line);
  font-family: var(--f-num); letter-spacing: .01em;
}

/* Por debajo de este ancho un riel de 248 px se come la pantalla: pasa a ser una
   tira horizontal en la parte de arriba, deja de estar fija y suelta el pie,
   cuyas cifras siguen estando en el pie del informe. */
@media (max-width: 1080px) {
  .rail {
    position: static; width: auto; overflow: visible;
    flex-direction: row; flex-wrap: wrap; align-items: center;
    border-right: 0; border-bottom: 1px solid var(--rail-line);
  }
  .rail .brand { border-bottom: 0; padding: var(--sp-3) var(--sp-4); }
  .pages { flex-direction: row; flex-wrap: wrap; padding: var(--sp-2) var(--sp-3); }
  .pages button { width: auto; padding: 7px var(--sp-3); }
  .pages button[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--s1); }
  .pages .glabel { padding: var(--sp-2) var(--sp-3) var(--sp-1); }
  .railfoot { display: none; }
  .app { margin-left: 0; padding-left: var(--sp-4); padding-right: var(--sp-4); }
}

.icon-btn {
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink-2);
  border-radius: var(--r-1); padding: var(--sp-1) var(--sp-3); font: inherit;
  font-size: var(--t-meta); cursor: pointer;
}
.icon-btn:hover { color: var(--ink); border-color: var(--axis); }

/* --- barra de filtros --- */
.filterbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
  padding: var(--sp-2) var(--sp-3); margin: var(--sp-4) 0 var(--sp-3);
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r-2); box-shadow: var(--shadow);
}
.filterbar #theme-toggle { margin-left: var(--sp-3); }
.filterbar .label { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ms { position: relative; }
.ms > button, select.plain {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  border: 1px solid var(--hairline); background: var(--plane); color: var(--ink);
  border-radius: var(--r-1); padding: 6px var(--sp-3); font: inherit;
  font-size: var(--t-body); cursor: pointer; min-height: 34px;
}
.ms > button:hover { border-color: var(--axis); }
.ms > button .caret { color: var(--muted); font-size: var(--t-nano); }
.ms > button.on { border-color: var(--s1); box-shadow: inset 0 0 0 1px var(--s1); }

/* Icono de filtro. Dice de que va cada desplegable sin tener que leerlo, y se
   tine de azul cuando ese filtro esta aplicado: es estado real, no adorno. */
.ficon { flex: none; color: var(--muted); display: block; }
.ms > button:hover .ficon { color: var(--ink-2); }
.ms > button.on .ficon { color: var(--s1); }
.fsel { position: relative; display: inline-flex; align-items: center; }
.fsel .islot {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  display: inline-flex; pointer-events: none;
}
.fsel select.plain { padding-left: 32px; }

.ms .pop {
  position: absolute; top: calc(100% + var(--sp-1)); left: 0; z-index: 50;
  min-width: 224px; max-height: 330px; overflow: auto;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r-2); padding: var(--sp-1); box-shadow: var(--shadow-pop);
}
.ms .pop[hidden] { display: none; }
.ms .pop label {
  display: flex; align-items: center; gap: var(--sp-2); padding: 5px var(--sp-2);
  border-radius: var(--r-1); cursor: pointer; font-size: var(--t-body);
}
.ms .pop label:hover { background: var(--plane); }
.ms .pop .sep { height: 1px; background: var(--hairline); margin: var(--sp-1) 2px; }
.ms .pop .mini { font-size: var(--t-meta); color: var(--ink-2); padding: var(--sp-1) var(--sp-2); cursor: pointer; }
.ms .pop .mini:hover { color: var(--s1); }
.filterbar .count { margin-left: auto; font-size: var(--t-meta); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.filterbar .count b { color: var(--ink); font-weight: var(--w-bold); }

/* --- cabecera de la pagina activa ---
   Con la navegacion fuera del flujo principal, el contenido necesita decir por
   si mismo que se esta mirando. El icono es el mismo de la lista: es lo que ata
   una cosa con la otra sin que haya que buscar la etiqueta resaltada. */
.pagehead { margin: var(--sp-5) 2px var(--sp-5); }
/* Encima del nombre, el bloque del informe al que pertenece la pagina: la misma
   voz y el mismo rotulo que en el riel, para que el salto de uno a otro no haya
   que reconstruirlo. */
.pagehead .eyebrow {
  font-family: var(--f-num); font-size: var(--t-nano);
  text-transform: uppercase; letter-spacing: .14em; color: var(--muted);
  margin-bottom: var(--sp-2);
}
.pagehead h2 {
  display: flex; align-items: center; gap: var(--sp-2); margin: 0;
  font-size: 19px; font-weight: var(--w-bold); letter-spacing: -.015em; color: var(--ink);
}
.pagehead h2 .pico { flex: none; color: var(--s1); }
.pagehead p {
  margin: var(--sp-1) 0 0; color: var(--ink-2);
  font-size: var(--t-meta); max-width: 92ch;
}

/* --- rejilla y tarjetas ---
   `align-items: stretch` (el valor por defecto de grid, aqui explicito porque
   es una decision) iguala el alto de las tarjetas que comparten fila: dos
   graficos en paralelo terminan a la misma altura aunque su contenido no mida
   lo mismo. */
.grid {
  display: grid; grid-template-columns: repeat(12, 1fr);
  gap: var(--sp-3); align-items: stretch;
}
.card {
  grid-column: span 12; min-width: 0; position: relative;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r-2); padding: var(--sp-3) var(--sp-4) var(--sp-4);
  box-shadow: var(--shadow);
}
.card.c3 { grid-column: span 3; } .card.c4 { grid-column: span 4; }
.card.c5 { grid-column: span 5; } .card.c6 { grid-column: span 6; }
.card.c7 { grid-column: span 7; } .card.c8 { grid-column: span 8; }
.card.c9 { grid-column: span 9; } .card.c12 { grid-column: span 12; }
/* Los cortes van 250 px por encima de lo que pedirian a pantalla completa: la
   columna de contenido ya no es el ancho de la ventana, le faltan el menu
   lateral y su hueco. Con los valores de antes, una tarjeta de 4 columnas se
   quedaba en 275 px justo donde antes tenia 360. */
@media (max-width: 1432px) {
  .card.c3, .card.c4, .card.c5 { grid-column: span 6; }
  .card.c7, .card.c8, .card.c9 { grid-column: span 12; }
}
@media (max-width: 900px) { .card { grid-column: span 12 !important; } }

/* El titulo y su pregunta comparten linea; en panel estrecho la pregunta cae
   sola a la segunda sin necesidad de media query. El hueco de la derecha
   reserva sitio para el conmutador grafico/tabla, que va fuera del flujo. */
.card .head {
  display: flex; flex-wrap: wrap; align-items: baseline;
  column-gap: var(--sp-2); row-gap: 2px;
  padding-right: 62px; margin-bottom: var(--sp-3);
}
.card h3 { margin: 0; font-size: var(--t-title); font-weight: var(--w-bold); letter-spacing: -.005em; color: var(--ink); }
.card .q { margin: 0; font-size: var(--t-meta); font-weight: var(--w-reg); color: var(--muted); }
.tbtn {
  position: absolute; top: var(--sp-3); right: var(--sp-4);
  border: 1px solid var(--hairline); background: none; color: var(--muted);
  border-radius: var(--r-1); font: inherit; font-size: var(--t-micro);
  padding: 2px var(--sp-2); cursor: pointer;
}
.tbtn:hover, .tbtn.on { color: var(--ink); border-color: var(--axis); }
.segrow { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-3); }
.seg { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--t-micro); color: var(--muted); }
.seg .opts { display: inline-flex; border: 1px solid var(--hairline); border-radius: var(--r-1); overflow: hidden; }
.seg button {
  border: 0; border-left: 1px solid var(--hairline); background: none; color: var(--ink-2);
  font: inherit; font-size: var(--t-micro); padding: 3px var(--sp-3); cursor: pointer;
}
.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--ink); background: var(--plane); }
.seg button.on { background: var(--s1); color: #fff; }
.note { margin-top: var(--sp-2); font-size: var(--t-micro); color: var(--muted); }
.insight {
  margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-3);
  border-left: 2px solid var(--s1); border-radius: var(--r-1);
  background: var(--plane); font-size: var(--t-meta); color: var(--ink-2);
}
.insight b { color: var(--ink); font-weight: var(--w-bold); }
/* Prosa dentro de una tarjeta: la pagina de metodo explica decisiones, y una
   tabla no es el sitio para un porque. Misma voz que `.insight`, sin el filete. */
.card .prose { font-size: var(--t-meta); color: var(--ink-2); margin: 0 0 var(--sp-3); }
.card .prose:last-child { margin-bottom: 0; }
.card .prose b { color: var(--ink); font-weight: var(--w-bold); }
.card .prose code {
  font-family: var(--f-num); font-size: var(--t-micro); color: var(--ink);
  background: var(--plane); border: 1px solid var(--hairline);
  border-radius: var(--r-1); padding: 0 4px;
}
.card ul.prose { padding-left: var(--sp-4); }
.card ul.prose li { margin-bottom: var(--sp-1); }

.tag {
  display: inline-block; font-size: var(--t-micro); padding: 1px var(--sp-2);
  border-radius: var(--r-pill); border: 1px solid var(--hairline);
  color: var(--muted); vertical-align: 2px;
}

/* --- recomendaciones ---
   El bloque que cierra cada pagina y la lista de portada. Dos decisiones que
   parecen de estilo y no lo son:

   - La escala de esfuerzo NO va codificada en color. Bajo / medio / alto es un
     orden, no un semaforo: pintar "alto" de rojo insinua que una recomendacion
     cara es una mala recomendacion, y la de mas capital en juego de este informe
     es justamente de esfuerzo alto. El orden lo lleva el numero de la izquierda,
     que es lo unico que ordena de verdad, y el esfuerzo va escrito con palabras.
   - La cifra de la portada usa `--f-num` y tabular para que las cinco lineas se
     comparen en vertical sin leerlas. La etiqueta de debajo dice QUE es esa
     cifra, porque no todas son lo mismo: una es ingreso recuperable y otra es el
     tamano del agujero que se vuelve diagnosticable. Sin la etiqueta, ponerlas
     en columna las igualaria y seria mentira.

   La tarjeta que las contiene es una `.card` normal (mismo fondo, mismo filete,
   misma rejilla de 12): es una conclusion, no un aviso, y un tratamiento distinto
   la sacaria del documento. */
.reco-card .head { margin-bottom: var(--sp-2); }
.reco-disclaimer {
  margin: 0 0 var(--sp-3); font-size: var(--t-micro); color: var(--muted);
  max-width: 78ch;
}
.reco { display: grid; gap: var(--sp-3); }
.reco-item {
  border: 1px solid var(--hairline); border-radius: var(--r-2);
  padding: var(--sp-3) var(--sp-4); background: var(--plane);
}
.reco-top { display: flex; align-items: baseline; gap: var(--sp-3); }
.reco-n {
  flex: none; width: 22px; text-align: right;
  font-family: var(--f-num); font-size: var(--t-body); font-weight: var(--w-bold);
  color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.reco-item h4 {
  margin: 0; font-size: var(--t-title); font-weight: var(--w-bold);
  line-height: 1.35; color: var(--ink); letter-spacing: -.005em;
}
.reco-item h4 code, .reco-fields code, .reco-ctx code {
  font-family: var(--f-num); font-size: var(--t-micro); color: var(--ink);
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r-1); padding: 0 4px;
}
.reco-meta {
  display: flex; flex-wrap: wrap; gap: var(--sp-2);
  margin: var(--sp-2) 0 var(--sp-3) calc(22px + var(--sp-3));
}
.reco-meta span, .t5-meta span {

/* --- indicadores ---
   Siete tarjetas independientes, todas del mismo tamano. La cifra manda y la
   unidad la acompana medio paso por detras: leer "12.111.837" y luego "EUR" es
   mas rapido que leerlo todo con el mismo peso. */
/* Siete columnas cuando caben y las que quepan cuando no. Va por `auto-fit` y no
   por media queries porque lo que manda aqui es el ancho del CONTENEDOR, no el
   de la ventana: con el menu lateral quitando 250 px, una regla por ventana
   dejaba siete tarjetas de 118 px y la cifra de ingresos, que no parte linea,

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: var(--sp-3); }

.kpi .d { font-size: var(--t-micro); color: var(--muted); margin-top: 3px; }
.kpi .d .up { color: var(--good); } .kpi .d .down { color: var(--bad); }

.chip .k { font-size: var(--t-micro); color: var(--muted); }
.chip .v {

.tablewrap { overflow: auto; max-height: 430px; margin-top: var(--sp-1); }

/* Tabla de texto, no de cifras. Las tablas de datos alinean a la derecha porque

.tablewrap.txt { max-height: none; }

.chart { width: 100%; position: relative; }
