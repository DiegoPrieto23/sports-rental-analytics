<title>Sports Rental · Informe interactivo</title>

<style>
/* ---------------------------------------------------------------------------
   Tokens. Paleta categorica de referencia con el azul corporativo #0082C3 en el
   primer slot; validada en claro y oscuro (banda de luminosidad, suelo de croma,
   separacion CVD, suelo de vision normal y contraste).
   --------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --plane:        #f9f9f7;
  --surface:      #fcfcfb;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --muted:        #898781;
  --grid:         #e1e0d9;
  --axis:         #c3c2b7;
  --hairline:     rgba(11,11,11,0.10);
  --neutral-mark: #b9b8b1;
  --good:         #006300;
  --bad:          #d03b3b;
  --warn:         #ec835a;
  --div-mid:      #f0efec;
  --s1: #0082C3; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --shadow: 0 1px 2px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --hairline: rgba(255,255,255,0.10); --neutral-mark: #55544f;
    --good: #0ca30c; --bad: #e66767; --warn: #ec835a; --div-mid: #383835;
    --s1: #1f9fdb; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --hairline: rgba(255,255,255,0.10); --neutral-mark: #55544f;
  --good: #0ca30c; --bad: #e66767; --warn: #ec835a; --div-mid: #383835;
  --s1: #1f9fdb; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: none;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 1640px; margin: 0 auto; padding: 0 16px 56px; }

header { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 20px 2px 12px; }
header h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
header .sub { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
header .spacer { flex: 1 1 auto; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
  border: 1px solid var(--hairline); border-radius: 999px;
  font-size: 11.5px; color: var(--ink-2); background: var(--surface);
}
.icon-btn {
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink-2);
  border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
}
.icon-btn:hover { color: var(--ink); }

/* --- barra de filtros --- */
.filterbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px; margin-bottom: 12px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 12px; box-shadow: var(--shadow);
}
.filterbar .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ms { position: relative; }
.ms > button, select.plain {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--hairline); background: var(--plane); color: var(--ink);
  border-radius: 8px; padding: 7px 11px; font: inherit; font-size: 13px;
  cursor: pointer; min-height: 34px;
}
.ms > button:hover { border-color: var(--axis); }
.ms > button .caret { color: var(--muted); font-size: 10px; }
.ms > button.on { border-color: var(--s1); box-shadow: inset 0 0 0 1px var(--s1); }
.ms .pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
  min-width: 224px; max-height: 330px; overflow: auto;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 10px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.14);
}
.ms .pop[hidden] { display: none; }
.ms .pop label {
  display: flex; align-items: center; gap: 9px; padding: 6px 8px;
  border-radius: 6px; cursor: pointer; font-size: 13px;
}
.ms .pop label:hover { background: var(--plane); }
.ms .pop .sep { height: 1px; background: var(--hairline); margin: 5px 2px; }
.ms .pop .mini { font-size: 12px; color: var(--ink-2); padding: 4px 8px; cursor: pointer; }
.ms .pop .mini:hover { color: var(--s1); }
.filterbar .count { margin-left: auto; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.filterbar .count b { color: var(--ink); font-weight: 600; }

/* --- paginas --- */
.pages { display: flex; gap: 3px; margin: 2px 0 6px; flex-wrap: wrap; }
.pages button {
  border: 1px solid transparent; background: none; color: var(--ink-2);
  font: inherit; font-size: 13px; padding: 7px 13px; cursor: pointer; border-radius: 8px;
}
.pages button:hover { background: var(--surface); color: var(--ink); }
.pages button[aria-selected="true"] {
  background: var(--surface); color: var(--ink); font-weight: 600;
  border-color: var(--hairline); box-shadow: inset 0 -2px 0 var(--s1);
}
.pagehead { margin: 6px 2px 12px; color: var(--ink-2); font-size: 12.5px; }

/* --- rejilla y tarjetas --- */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-items: start; }
.card {
  grid-column: span 12; background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 14px 16px 12px; box-shadow: var(--shadow); min-width: 0;
}
.card.c3 { grid-column: span 3; } .card.c4 { grid-column: span 4; }
.card.c5 { grid-column: span 5; } .card.c6 { grid-column: span 6; }
.card.c7 { grid-column: span 7; } .card.c8 { grid-column: span 8; }
.card.c9 { grid-column: span 9; }
@media (max-width: 1180px) {
  .card.c3, .card.c4, .card.c5 { grid-column: span 6; }
  .card.c7, .card.c8, .card.c9 { grid-column: span 12; }
}
@media (max-width: 720px) { .card { grid-column: span 12 !important; } }

.card h3 { margin: 0; font-size: 13.5px; font-weight: 620; letter-spacing: -.005em; }
.card .q { margin: 3px 0 10px; font-size: 12px; color: var(--ink-2); }
.card .head { display: flex; align-items: baseline; gap: 10px; }
.card .head .spacer { flex: 1 1 auto; }
.tbtn {
  border: 1px solid var(--hairline); background: none; color: var(--muted);
  border-radius: 6px; font: inherit; font-size: 11px; padding: 2px 7px; cursor: pointer;
}
.tbtn:hover, .tbtn.on { color: var(--ink); border-color: var(--axis); }
.segrow { display: flex; gap: 16px; flex-wrap: wrap; margin: 2px 0 10px; }
.seg { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); }
.seg .opts { display: inline-flex; border: 1px solid var(--hairline); border-radius: 7px; overflow: hidden; }
.seg button {
  border: 0; border-left: 1px solid var(--hairline); background: none; color: var(--ink-2);
  font: inherit; font-size: 11.5px; padding: 3px 10px; cursor: pointer;
}
.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--ink); background: var(--plane); }
.seg button.on { background: var(--s1); color: #fff; }
.note { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.insight {
  margin-top: 10px; padding: 9px 11px; border-left: 2px solid var(--s1);
  background: var(--plane); border-radius: 0 8px 8px 0; font-size: 12.3px; color: var(--ink-2);
}
.insight b { color: var(--ink); font-weight: 600; }
.tag {
  display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid var(--hairline); color: var(--muted); vertical-align: 2px;
}

/* --- tiles --- */
.kpis { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 720px)  { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.kpi .v { font-size: 25px; font-weight: 640; letter-spacing: -.02em; margin-top: 4px; line-height: 1.1; }
.kpi .d { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.kpi .d .up { color: var(--good); } .kpi .d .down { color: var(--bad); }
.chips { display: flex; gap: 18px; flex-wrap: wrap; margin: 2px 0 6px; }
.chip .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.chip .v { font-size: 19px; font-weight: 620; letter-spacing: -.01em; }
.chip .v small { font-size: 12px; font-weight: 400; color: var(--muted); }

/* --- tablas --- */
.tablewrap { overflow: auto; max-height: 430px; margin-top: 4px; }
table.dt { width: 100%; border-collapse: collapse; font-size: 12.2px; }
table.dt th, table.dt td { padding: 5px 9px; text-align: right; white-space: nowrap; }
table.dt th:first-child, table.dt td:first-child { text-align: left; }
table.dt th {
  position: sticky; top: 0; background: var(--surface); color: var(--muted);
  font-weight: 550; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  border-bottom: 1px solid var(--hairline);
}
table.dt td { border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; color: var(--ink-2); }
table.dt td:first-child { color: var(--ink); }
table.dt tbody tr:hover td { background: var(--plane); }
.sig { color: var(--good); font-weight: 600; }
.nosig { color: var(--muted); }

/* --- graficos --- */
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
.chart text.val { fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart text.lbl { fill: var(--ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 2px 0 6px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend .ln { display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: 4px; }
.scale { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.scale .ramp { height: 8px; width: 120px; border-radius: 2px; }

#tip {
  position: fixed; z-index: 90; pointer-events: none; opacity: 0;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.16);
  transition: opacity .08s linear; max-width: 300px;
}
#tip .t { font-weight: 620; margin-bottom: 3px; }
#tip .r { display: flex; gap: 12px; justify-content: space-between; color: var(--ink-2); }
#tip .r b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--hairline); color: var(--muted); font-size: 11.8px; }
footer p { margin: 5px 0; }
#boot { padding: 60px 4px; color: var(--ink-2); }
.hidden { display: none !important; }
</style>
